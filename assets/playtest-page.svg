<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1050" viewBox="0 0 750 1050" role="img" aria-labelledby="title description">
  <title id="title">Valiance playtest page</title>
  <desc id="description">A neutral Valiance TCG card face used for the included playtest cards.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#202b25"/>
      <stop offset="1" stop-color="#101510"/>
    </linearGradient>
    <radialGradient id="aether" cx="50%" cy="45%" r="48%">
      <stop stop-color="#e8d98b" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#5d7f72" stop-opacity=".45"/>
      <stop offset="1" stop-color="#101510" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="750" height="1050" fill="#080b09"/>
  <rect x="27" y="27" width="696" height="996" rx="24" fill="url(#background)" stroke="#d7c878" stroke-width="10"/>
  <rect x="49" y="49" width="652" height="952" rx="15" fill="none" stroke="#f4e5a0" stroke-opacity=".65" stroke-width="3"/>
  <circle cx="375" cy="455" r="285" fill="url(#aether)"/>
  <path d="M375 190 490 400 375 620 260 400Z" fill="none" stroke="#e8d98b" stroke-width="15"/>
  <path d="M375 280 440 400 375 520 310 400Z" fill="#d9b94d" fill-opacity=".22" stroke="#f6e7a0" stroke-width="7"/>
  <text x="375" y="115" fill="#f6e7a0" font-family="Georgia, serif" font-size="46" font-weight="700" letter-spacing="10" text-anchor="middle">VALIANCE</text>
  <text x="375" y="720" fill="#f6e7a0" font-family="Georgia, serif" font-size="44" font-weight="700" text-anchor="middle">PLAYTEST PAGE</text>
  <text x="375" y="778" fill="#c8c8b1" font-family="Arial, sans-serif" font-size="24" letter-spacing="3" text-anchor="middle">SEE DECK BUILDER FOR DETAILS</text>
  <path d="M105 870H645" stroke="#d7c878" stroke-width="3"/>
  <text x="375" y="920" fill="#d7c878" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">RULEBOOK STRUCTURE • TABLETOP SIMULATOR</text>
